name: sigvach
description: "Proyecto SIGVACH - base adaptada del proyecto acumulativo (asincronia, API REST, GPS, mapa y Firebase)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.5+1
  shared_preferences: 2.5.5
  http: 1.6.0
  geolocator: 14.0.3
  flutter_map: 8.3.2
  latlong2: 0.10.1
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#39B54A"
  adaptive_icon_foreground: "assets/images/icon.png"
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#39B54A"
    theme_color: "#39B54A"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
